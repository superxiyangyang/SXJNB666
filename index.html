<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SXJNB666</title>
    <style>
        /* ==========================================
           基础变量与全局设定 (现代低饱和高级数码风)
        ========================================== */
        :root {
            --bg-base: #121214;          /* 极简深色背景 */
            --bg-surface: #1a1a1d;       /* 卡片/表面背景 */
            --text-primary: #e6e6e6;     /* 主文本高亮 */
            --text-secondary: #8a8a93;   /* 副文本低饱和 */
            --border-color: #2c2c30;     /* 边框分割线 */
            --btn-bg: #2b2b2f;           /* 按钮背景 */
            --btn-hover: #3a3a40;        /* 按钮悬浮 */
            --radius-md: 12px;           /* 圆角标准 */
            --radius-sm: 8px;
            --transition-smooth: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ==========================================
           顶部导航栏
        ========================================== */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 6%;
            background: rgba(18, 18, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
            display: flex;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-primary);
            text-decoration: none;
        }

        /* ==========================================
           首页横幅视觉区 (Hero Section)
        ========================================== */
        .hero {
            height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            margin-top: 60px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: clamp(1rem, 2vw, 1.25rem);
            max-width: 600px;
        }

        /* ==========================================
           软件下载分区 (卡片网格布局)
        ========================================== */
        .downloads-section {
            padding: 60px 6% 100px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        /* 软件卡片样式与悬浮动画 */
        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            transition: var(--transition-smooth);
            will-change: transform, box-shadow;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            border-color: #3e3e44;
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            flex-grow: 1;
            margin-bottom: 32px;
        }

        /* 按钮交互与点击反馈 */
        .download-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            background-color: var(--btn-bg);
            color: var(--text-primary);
            text-decoration: none;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            border: 1px solid transparent;
        }

        .download-btn:hover {
            background-color: var(--btn-hover);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .download-btn:active {
            transform: scale(0.97);
        }

        /* ==========================================
           页脚板块
        ========================================== */
        footer {
            padding: 40px 6%;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* ==========================================
           轻量化滚动渐显动画 (Reveal Animation)
        ========================================== */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 页面初次载入渐变 */
        .fade-in-load {
            animation: fadeIn 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================
           响应式适配 (Mobile & Tablet)
        ========================================== */
        @media (max-width: 768px) {
            .card {
                padding: 30px 24px;
            }
            .downloads-section {
                padding: 40px 6% 80px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo fade-in-load">SXJNB666</a>
    </nav>

    <header class="hero fade-in-load" style="animation-delay: 0.1s;">
        <h1>SXJNB666</h1>
        <p>探索纯粹的数字体验</p>
    </header>

    <section class="downloads-section">
        <div class="card-grid">
            
            <div class="card reveal">
                <h2>equalizerAPO</h2>
                <p>此处为 equalizerAPO 软件简介占位文本。可根据需要替换为详细的软件功能描述或配置要求说明。</p>
                <a href="#" class="download-btn">立即下载</a>
            </div>

            <div class="card reveal">
                <h2>FXSOUND</h2>
                <p>此处为 FXSOUND 软件简介占位文本。可根据需要替换为详细的软件功能描述或配置要求说明。</p>
                <a href="#" class="download-btn">立即下载</a>
            </div>

            <div class="card reveal">
                <h2>赛睿 GG</h2>
                <p>此处为 赛睿 GG 软件简介占位文本。可根据需要替换为详细的软件功能描述或配置要求说明。</p>
                <a href="#" class="download-btn">立即下载</a>
            </div>

        </div>
    </section>

    <footer>
        <p>&copy; 2026 SXJNB666. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 滚动渐显动画逻辑 (Intersection Observer API)
            const revealElements = document.querySelectorAll('.reveal');

            // 配置观察器
            const observerOptions = {
                root: null,        // 使用视口作为根
                rootMargin: '0px',
                threshold: 0.15    // 元素露出 15% 时触发
            };

            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // 添加 active 类以触发 CSS 动画
                        entry.target.classList.add('active');
                        // 动画触发后取消观察，提升页面性能
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            // 将所有带有 .reveal 类的元素加入观察列表
            revealElements.forEach(element => {
                revealObserver.observe(element);
            });
        });
    </script>

</body>
</html>
